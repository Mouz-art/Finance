{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-header bg-light">
        <h3 class="h5 mb-0">
          {% if exercise %}Modifier l'exercice{% else %}Créer un exercice{% endif %}
        </h3>
      </div>
      <div class="card-body">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Nom de l'exercice</label>
            <input type="text"
                   name="name"
                   class="form-control"
                   placeholder="Ex : 2024-2025"
                   value="{{ exercise.name if exercise else '' }}"
                   required>
          </div>

          <button type="submit" class="btn btn-primary">
            {% if exercise %}Enregistrer{% else %}Créer{% endif %}
          </button>

          <a href="{{ url_for('exercises_list') }}" class="btn btn-secondary ms-2">
            Annuler
          </a>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
